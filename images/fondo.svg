<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024" height="1024"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradiente de cielo -->
    <linearGradient id="skyGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b2a3a"/>
      <stop offset="100%" stop-color="#020615"/>
    </linearGradient>

    <style><![CDATA[
      .bg { fill: url(#skyGrad); }
      .star {
        fill: white;
        opacity: 0.3;
        animation: twinkle 3s infinite ease-in-out;
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
    ]]></style>
  </defs>

  <!-- Fondo -->
  <rect class="bg" width="1024" height="1024"/>

  <!-- Estrellas -->
  <g id="stars">
    <!-- 100 estrellas con posiciones, radios y delays variados -->
    <!-- He generado aleatoriamente sus coordenadas -->
    <!-- Puedes duplicar este bloque si quieres más densidad -->
    <!-- fila 1 -->
    <circle class="star" cx="120" cy="80" r="1.2" style="animation-delay:0s"/>
    <circle class="star" cx="200" cy="150" r="3" style="animation-delay:0.3s"/>
    <circle class="star" cx="320" cy="60" r="1.0" style="animation-delay:1.1s"/>
    <circle class="star" cx="450" cy="110" r="1.8" style="animation-delay:2.4s"/>
