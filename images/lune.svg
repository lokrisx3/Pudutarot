<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">Luna menguante</title>
  <desc id="desc">Luna menguante con cráteres al lado izquierdo y un efecto de iluminación brillante y halo animado.</desc>

  <style>
    :root{
      --moon:#f5f0b7;
      --shadow:#0a0a0a;
      --accent:#e6df8a;
      --glow:#fffbe6;
    }

    /* Animación de pulso tenue */
    .soft-pulse {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%   { opacity: 0.25; }
      50%  { opacity: 0.55; }
      100% { opacity: 0.25; }
    }
  </style>

  <defs>
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="var(--glow)" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="var(--glow)" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <mask id="crescentMask">
    <rect x="0" y="0" width="100%" height="100%" fill="white"/>
    <circle cx="115" cy="100" r="62" fill="black"/>
  </mask>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Halo exterior animado -->
  <circle class="soft-pulse" cx="85" cy="100" r="95" fill="url(#moonHalo)" />

  <!-- Zona iluminada con brillo -->
  <g mask="url(#crescentMask)" filter="url(#softGlow)">
    <circle cx="85" cy="100" r="68" fill="var(--moon)"/>
    <!-- Luz adicional animada -->
    <circle class="soft-pulse" cx="85" cy="100" r="74" fill="var(--glow)" opacity="0.58"/>
  </g>

  <!-- Borde tenue de la luna -->
  <circle cx="85" cy="100" r="68" fill="none" stroke="rgba(223, 223, 91, 0.14)" stroke-width="2"/>

  <!-- Cráteres -->
  <g opacity="0.28">
    <circle cx="48" cy="102" r="4" fill="rgba(0,0,0,0.18)"/>
    <circle cx="40" cy="80" r="3" fill="rgba(0,0,0,0.16)"/>
    <circle cx="40" cy="90" r="2.5" fill="rgba(0,0,0,0.14)"/>
  </g>
</svg>
